# Cloudflare Workers (static assets) deploy for this zfb example.
#
#   build  — always runs (push + PR): install, typecheck (`zfb check`), build
#            (`zfb build`). This is the L3 build-output gate; it needs no
#            Cloudflare credentials, so a fresh clone/fork is green immediately.
#   deploy — push to `main` only: runs `wrangler deploy`, but SELF-SKIPS when
#              * secrets.CLOUDFLARE_API_TOKEN is unset, or
#              * wrangler.toml still holds a REPLACE_WITH_* placeholder id.
#            So the repo never shows a red deploy before Cloudflare is wired up.
#            It then smoke-tests the live custom domain, which likewise self-skips
#            until the domain resolves.
#
# Enable deploys by adding, in repo Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   token with Account · Workers Scripts: Edit
#                          (+ Account Settings: Read), and — because this repo
#                          serves production on the custom domain declared in
#                          wrangler.toml's [[routes]] — Zone · Workers Routes:
#                          Edit on the takazudomodular.com zone. This example
#                          declares only the ASSETS binding, so no KV, AI, or D1
#                          permissions are needed. `PROXY_ORIGIN` is a public
#                          [vars] value, not a secret.
#   CLOUDFLARE_ACCOUNT_ID  target Cloudflare account id
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (typecheck + zfb build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Preflight — is Cloudflare configured?
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping deploy. Add it and CLOUDFLARE_ACCOUNT_ID in repo Settings to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q "REPLACE_WITH" wrangler.toml; then
            echo "::notice::wrangler.toml still has a REPLACE_WITH_* placeholder — provision the resource, commit the real id, then deploy will run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      # Only `wrangler deploy` exiting 0 is not evidence the site is reachable on
      # its custom domain — this step is. It self-skips (exit 0 + ::notice::) while
      # the domain is not attached yet, and degrades an httpbingo.org outage to a
      # ::warning::, so it only goes red when the proxy is genuinely broken.
      # Deliberately NOT `if: always()` — smoking a failed deploy is meaningless.
      - name: Smoke test the live custom domain
        if: steps.preflight.outputs.ready == 'true'
        run: pnpm smoke
